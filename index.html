<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochul Download Center</title>
    <link rel="stylesheet" href="style.css">
    <meta
      http-equiv="Cache-Control"
      content="No-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Hochul Mods Donwload Center" />
    <meta
      name="keywords"
      content="Hochul, Hochul Mods, Hochul Download Center, 호철, 호철 모드, 호철 유로트럭, 유로트럭 버스모드, 유로트럭 버스모드 다운로드, 유로트럭 버스"
    />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="hochul.ico">
    <title>Hochul Download Center</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Hochul Download Center" />
    <meta property="og:description" content="Hochul Mods Donwload Center" />
    <meta property="og:url" content="https://hochul.co.kr" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <header class="header">
      <h1>Hochul Download Center</h1>
      
      <!-- 소셜 버튼 -->
      <div class="social-buttons">
        <a href="https://youtube.com/@호철Hochul" target="_blank" class="social-btn youtube">YouTube</a>
        <a href="https://discord.gg/hochul" target="_blank" class="social-btn discord">Discord</a>
      </div>

      <div class="filters">
        <input type="text" id="search" placeholder="검색..." />
        <select id="manufacturerFilter">
          <option value="all">브랜드</option>
        </select>

        <select id="categoryFilter">
          <option value="all">차종</option>
        </select>

        <select id="sortFilter">
          <option value="latest">최신순</option>
          <option value="name">이름순</option>
        </select>
      </div>

    </header>

    <!-- 카드 영역 -->
    <div id="addon-list"></div>

    <!-- 모달 -->
    <div id="addon-modal" class="modal">
      <div class="modal-content">
        <span id="modal-close">&times;</span>
        <img id="modal-img" src="" alt="미리보기" />
        <h3 id="modal-name"></h3>
        <p id="modal-version"></p>
        <a id="modal-download" href="#" download>
          <button>모드 다운로드</button>
        </a>
        <div id="modal-custom-container"></div>
      </div>
    </div>

    <footer class="footer">
    <p>© 2025 Hochul. All rights reserved.</p>
    </footer>



    <script src="script.js"></script>
  </body>
</html>
